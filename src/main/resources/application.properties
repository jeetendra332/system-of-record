spring.application.name=system-of-record

spring.datasource.url=jdbc:mysql://localhost:3306/sor_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=sor_user
spring.datasource.password=sor_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000


# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=System of Record
info.app.description=Employee and Department Management System
info.app.version=1.0.0


# Application logging
logging.level.root=INFO
logging.level.com.example.sor=DEBUG
logging.level.org.springframework.security=INFO

# Log file
logging.file.name=logs/system-of-record.log

# Log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
