spring.application.name=system-of-record

# Aiven MySQL database
spring.datasource.url=jdbc:mysql://mysql-150f1dc5-jeetendra2002singh-efce.g.aivencloud.com:23463/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8081}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=System of Record
info.app.description=Employee and Department Management System
info.app.version=1.0.0

# Logging
logging.level.root=INFO
logging.level.com.example.sor=INFO
logging.level.org.springframework.security=INFO
logging.file.name=logs/system-of-record.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n